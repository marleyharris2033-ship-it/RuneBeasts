<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#11182c">
<title>Rune Beasts</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<main id="app">
<section id="titleScreen" class="screen active">
  <div class="logo">R</div>
  <h1>RUNE BEASTS</h1>
  <p class="tag">Bind. Battle. Evolve.</p>
  <div class="panel titlePanel">
    <button id="newGameBtn" class="primary big">NEW GAME</button>
    <button id="continueBtn" class="secondary big hidden">CONTINUE</button>
  </div>
</section>

<section id="starterScreen" class="screen">
  <div class="top"><button data-screen="titleScreen" class="back">←</button><h2>Choose your starter</h2></div>
  <p class="muted">Each starter begins at Level 5 with its own moves.</p>
  <div id="starterChoices"></div>
</section>

<section id="worldScreen" class="screen">
  <div class="top gameTop">
    <div><small>AREA</small><b>Runevale Meadow</b></div>
    <div class="shards">✦ <span id="shards">100</span></div>
  </div>

  <div class="panel mapPanel">
    <div id="map" class="mapGrid" aria-label="Runevale Meadow map"></div>
    <div class="mapHud">
      <div id="worldText">Use the controls to explore.</div>
      <div class="dpad">
        <span></span><button data-dir="up">▲</button><span></span>
        <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="top"><b>PARTY</b><span id="partyCount"></span></div>
    <div id="partyMini"></div>
  </div>

  <nav>
    <button data-screen="worldScreen">Explore</button>
    <button data-screen="partyScreen">Party</button>
    <button data-screen="dexScreen">Beastdex</button>
    <button data-screen="profileScreen">Save</button>
  </nav>
</section>

<section id="battleScreen" class="screen">
  <div class="battleTop"><button id="battleBack" class="back hidden">←</button><span></span></div>
  <div class="arena">
    <div class="zone enemyZone">
      <div class="info">
        <div class="nameLine"><b id="enemyName"></b><span id="enemyLevel"></span></div>
        <div id="enemyType"></div>
        <div class="hp"><i id="enemyHpBar"></i></div>
      </div>
      <div id="enemySprite" class="sprite"></div>
    </div>

    <div class="zone playerZone">
      <div id="playerSprite" class="sprite"></div>
      <div class="info">
        <div class="nameLine"><b id="playerName"></b><span id="playerLevel"></span></div>
        <div id="playerType"></div>
        <div class="hp"><i id="playerHpBar"></i></div>
        <small id="playerHpText"></small>
      </div>
    </div>
  </div>

  <div class="panel battlePanel">
    <p id="battleText">A wild Rune Beast appeared!</p>

    <div id="mainBattleMenu" class="actions">
      <button id="movesBtn" class="primary">MOVES</button>
      <button id="captureBtn" class="secondary">BIND</button>
      <button id="switchBtn" class="secondary">PARTY</button>
      <button id="runBtn" class="danger">RUN</button>
    </div>

    <div id="movesMenu" class="moveGrid hidden"></div>
    <div id="switchMenu" class="switchMenu hidden"></div>
    <button id="cancelBattleSubmenu" class="secondary big hidden">BACK</button>
  </div>
</section>

<section id="partyScreen" class="screen">
  <div class="top"><button data-screen="worldScreen" class="back">←</button><h2>Your Party</h2></div>
  <div id="partyList"></div>
</section>

<section id="dexScreen" class="screen">
  <div class="top"><button data-screen="worldScreen" class="back">←</button><h2>Beastdex</h2></div>
  <div class="panel"><b id="dexProgress"></b></div>
  <div id="dexList" class="dex"></div>
</section>

<section id="profileScreen" class="screen">
  <div class="top"><button data-screen="worldScreen" class="back">←</button><h2>Save</h2></div>
  <div class="panel">
    <p>Progress saves automatically on this device.</p>
    <div id="saveStats"></div>
    <button id="healBtn" class="secondary big">REST PARTY</button>
    <button id="manualSaveBtn" class="primary big">SAVE NOW</button>
    <button id="resetBtn" class="danger big">RESET GAME</button>
  </div>
</section>
</main>
<script src="app.js?v=2"></script>
</body>
</html>
