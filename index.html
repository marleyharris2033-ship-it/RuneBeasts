<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15182a"><title>Rune Beasts</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css?v=1"></head><body><main>
<section id="titleScreen" class="screen active"><div class="logo">R</div><h1>RUNE BEASTS</h1><p class="tag">Bind. Battle. Evolve.</p><div class="panel"><button id="newGameBtn" class="primary big">NEW GAME</button><button id="continueBtn" class="secondary big hidden">CONTINUE</button></div></section>
<section id="starterScreen" class="screen"><div class="top"><button data-screen="titleScreen">←</button><h2>Choose your starter</h2></div><div id="starterChoices"></div></section>
<section id="worldScreen" class="screen"><div class="top"><div><small>AREA</small><b>Runevale Meadow</b></div><div>✦ <span id="shards">100</span></div></div><div class="panel map"><div class="tiles">♣ ♣ · ♣<br>♣ ◆ · ♣<br>♣ ♣ · ♣</div><p id="worldText">The grass rustles around you...</p><button id="exploreBtn" class="primary big">EXPLORE</button></div><div class="panel"><div class="top"><b>PARTY</b><span id="partyCount"></span></div><div id="partyMini"></div></div><nav><button data-screen="worldScreen">Explore</button><button data-screen="partyScreen">Party</button><button data-screen="dexScreen">Beastdex</button><button data-screen="profileScreen">Save</button></nav></section>
<section id="battleScreen" class="screen"><div class="arena"><div class="zone"><div class="info"><b id="enemyName"></b><span id="enemyLevel"></span><div class="hp"><i id="enemyHpBar"></i></div></div><div id="enemySprite" class="sprite"></div></div><div class="zone player"><div id="playerSprite" class="sprite"></div><div class="info"><b id="playerName"></b><span id="playerLevel"></span><div class="hp"><i id="playerHpBar"></i></div><small id="playerHpText"></small></div></div></div><div class="panel"><p id="battleText">A wild Rune Beast appeared!</p><div class="actions"><button id="attackBtn" class="primary">ATTACK</button><button id="captureBtn" class="secondary">BIND</button><button id="switchBtn" class="secondary">PARTY</button><button id="runBtn" class="danger">RUN</button></div></div></section>
<section id="partyScreen" class="screen"><div class="top"><button data-screen="worldScreen">←</button><h2>Your Party</h2></div><div id="partyList"></div></section>
<section id="dexScreen" class="screen"><div class="top"><button data-screen="worldScreen">←</button><h2>Beastdex</h2></div><div class="panel"><b id="dexProgress"></b></div><div id="dexList" class="dex"></div></section>
<section id="profileScreen" class="screen"><div class="top"><button data-screen="worldScreen">←</button><h2>Save</h2></div><div class="panel"><p>Progress saves automatically.</p><div id="saveStats"></div><button id="manualSaveBtn" class="primary big">SAVE NOW</button><button id="resetBtn" class="danger big">RESET GAME</button></div></section>
</main><script src="app.js?v=1"></script></body></html>
