<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0f1629"><title>Rune Beasts</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css?v=12"></head><body><main id="app">
<section id="titleScreen" class="screen active">
<div id="titleSplash" class="splashScreen" role="button" aria-label="Tap to start Rune Beasts">
  <img src="title_screen.png" alt="Rune Beasts title screen">
  <button id="newGameBtn" class="splashTap" aria-label="Start new game"></button>
  <button id="continueBtn" class="continueOverlay hidden">Continue</button>
</div>
</section>
<section id="setupScreen" class="screen"><img class="brandLogo" src="rune_beasts_logo.png" alt="Rune Beasts"><div class="topbar"><button class="backBtn" data-screen="titleScreen">←</button><h2>Trainer setup</h2></div><div class="panel"><label class="fieldLabel">Trainer name</label><input id="trainerNameInput" maxlength="14" placeholder="Enter your name"><label class="fieldLabel">Choose trainer</label><div class="trainerChoiceRow"><button id="boyChoice" class="trainerChoice active"><div class="trainerPreview"><img src="boy_down_0.png" alt="Boy trainer"></div><b>Boy</b></button><button id="girlChoice" class="trainerChoice"><div class="trainerPreview"><img src="girl_down_0.png" alt="Girl trainer"></div><b>Girl</b></button></div><button id="toStarterBtn" class="primary big">Continue to starter</button></div></section>
<section id="starterScreen" class="screen"><div class="topbar"><button class="backBtn" data-screen="setupScreen">←</button><h2>Choose your starter</h2></div><p class="muted">Pick your first Rune Beast.</p><div id="starterChoices" class="grid cards"></div></section>
<section id="worldScreen" class="screen"><div class="topbar"><div><small>AREA</small><div class="areaName">Runevale Route</div></div><div class="hud"><span id="trainerBadge"></span> ✦ <span id="shards">100</span></div></div><div class="panel"><div class="canvasFrame"><canvas id="worldCanvas" width="320" height="240"></canvas></div><p id="worldText" class="worldText">Explore the world. Tall grass can trigger battles.</p><div class="legend"><span><i class="chip chip-grass"></i>Tall grass = encounters</span><span><i class="chip chip-spring"></i>Spring = heal</span><span><i class="chip chip-save"></i>Crystal = save point</span></div><div class="dpad"><span></span><button class="control" data-dir="up">▲</button><span></span><button class="control" data-dir="left">◀</button><button class="control" data-dir="down">▼</button><button class="control" data-dir="right">▶</button></div></div><div class="panel"><div class="topbar smallbar"><b>Party</b><span id="partyCount"></span></div><div id="partyMini"></div></div><nav class="bottomNav"><button data-screen="worldScreen">Explore</button><button data-screen="partyScreen">Party</button><button data-screen="dexScreen">Beastdex</button><button data-screen="profileScreen">Profile</button></nav></section>
<section id="battleScreen" class="screen"><div class="battleArena"><div class="battleRow enemy"><div class="battleInfo"><div class="nameRow"><b id="enemyName"></b><span id="enemyLevel"></span></div><div id="enemyType"></div><div class="hpBar"><i id="enemyHpBar"></i></div></div><div id="enemySprite" class="battleSprite"></div></div><div class="battleRow player"><div id="playerSprite" class="battleSprite"></div><div class="battleInfo"><div class="nameRow"><b id="playerName"></b><span id="playerLevel"></span></div><div id="playerType"></div><div class="hpBar"><i id="playerHpBar"></i></div><small id="playerHpText"></small></div></div></div><div class="panel"><p id="battleText" class="battleText">A wild Rune Beast appeared!</p><div id="mainBattleMenu" class="actions"><button id="movesBtn" class="primary">Moves</button><button id="captureBtn" class="secondary">Bind</button><button id="switchBtn" class="secondary">Party</button><button id="runBtn" class="danger">Run</button></div><div id="movesMenu" class="menuGrid hidden"></div><div id="switchMenu" class="switchMenu hidden"></div><button id="cancelBattleSubmenu" class="secondary big hidden">Back</button></div></section>
<section id="partyScreen" class="screen"><div class="topbar"><button class="backBtn" data-screen="worldScreen">←</button><h2>Your Party</h2></div><div id="partyList"></div></section>
<section id="dexScreen" class="screen"><div class="topbar"><button class="backBtn" data-screen="worldScreen">←</button><h2>Beastdex</h2></div><div class="panel"><b id="dexProgress">0 / 24 discovered</b></div><div id="dexList" class="grid cards"></div></section>
<section id="profileScreen" class="screen"><img class="brandLogo smallBrand" src="rune_beasts_logo.png" alt="Rune Beasts"><div class="topbar"><button class="backBtn" data-screen="worldScreen">←</button><h2>Trainer Profile</h2></div><div class="panel"><div class="profileHead"><div class="profileSprite" id="profileSprite"></div><div><h3 id="profileName"></h3><div id="profileGender" class="muted"></div></div></div><div id="saveStats"></div><button id="healBtn" class="secondary big">Rest Party</button><button id="manualSaveBtn" class="primary big">Save Now</button><button id="resetBtn" class="danger big">Reset Game</button></div></section>
</main><script src="assets-beasts.js?v=10"></script><script src="assets-tiles.js?v=10"></script><script src="assets-objects.js?v=10"></script><script src="assets-trainers.js?v=10"></script><script src="assets-town.js?v=11"></script><script src="app.js?v=12"></script></body></html>
